name: ci

# Runs on every push and PR. Four gates an auditor also runs locally:
#   test  -- the full suite (node selftests + forge test) across a Node matrix
#   rust  -- every Rust workspace target and feature, including tests
#   lint  -- `npm run lint` (eslint bug net, not a formatter)
#   audit -- `npm run audit:ci` supply-chain gate (blocks on critical advisories)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust workspace
    uses: ./.github/workflows/rust-verify.yml

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Run the full suite (node selftests + forge test)
        run: npm test

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  audit:
    name: supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # Blocking gate: fails CI on any high or critical production advisory.
      - name: Audit production dependencies (high or critical)
        run: npm run audit:ci
