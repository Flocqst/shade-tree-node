name: release

# Build the distributable `rgoe` binary and attach it to a GitHub Release (T-RUST-4).
# SEPARATE from ci.yml (which stays the correctness gate) — this workflow only packages.
#
# Two honest binary flavors:
#   - DEFAULT `rgoe` (deterministic core: verify-directory / select / verify-receipt /
#     fetch-directory). Pure Rust, no native deps, so it CROSS-COMPILES cleanly to the full
#     target matrix (linux gnu+musl x64/arm64, macOS x64/arm64, windows x64). Linux cross is
#     done with cargo-zigbuild (zig supplies the cross linker); macOS/windows build on their
#     own runner. No embedded circuit artifacts, so it stays small.
#   - LIVE `rgoe` (egress: RLN Groth16 prover via ark-circom->wasmer + embedded Tor via arti).
#     Heavy native deps that are NOT worth statically cross-linking, so each `live` binary is
#     built NATIVELY on its runner OS: ubuntu=linux-x64, macos=arm64, windows=x64. The RLN
#     circuit artifacts are `include_bytes!`'d in (rgoe-rln `embedded-artifacts` feature,
#     enabled by `rgoe-client`'s `live`), so the `live` binary is self-contained — no external
#     circuit files needed to egress.
#
# TESTNET-ONLY artifacts: the embedded ZK artifacts are from an UNTRUSTED testnet ceremony
# (docs/SHIP-PLAN.md T-HARD-1). A production release must re-embed audited artifacts.
#
# Assets are named `rgoe-<version>-<target>` (default) and `rgoe-<version>-<target>-live`
# (live), each with a `.sha256`. Symbols are stripped by `[profile.release]` (strip = true).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write # attach assets to the Release on a tag push

jobs:
  set-version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------ default (cross)
  default:
    name: default ${{ matrix.target }}
    needs: set-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: x86_64-apple-darwin, os: macos-latest, cross: false }
          - { target: aarch64-apple-darwin, os: macos-latest, cross: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, cross: false, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig + cargo-zigbuild (linux cross)
        if: ${{ matrix.cross }}
        uses: mlugg/setup-zig@v1
      - name: Install cargo-zigbuild (linux cross)
        if: ${{ matrix.cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build (cross via zigbuild)
        if: ${{ matrix.cross }}
        working-directory: rust
        run: cargo zigbuild --release -p rgoe-client --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        working-directory: rust
        run: cargo build --release -p rgoe-client --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          BIN="rust/target/${{ matrix.target }}/release/rgoe${{ matrix.ext }}"
          OUT="rgoe-${{ needs.set-version.outputs.version }}-${{ matrix.target }}${{ matrix.ext }}"
          cp "$BIN" "dist/$OUT"
          ( cd dist && shasum -a 256 "$OUT" > "$OUT.sha256" )
          ls -l dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rgoe-${{ matrix.target }}
          path: dist/*

      - name: Attach to Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # ------------------------------------------------------------------ live (native per runner)
  live:
    name: live ${{ matrix.target }}
    needs: set-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # ensure circuits/rln/* is present for include_bytes!

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build live (native, embedded artifacts)
        working-directory: rust
        run: cargo build --release -p rgoe-client --features live --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          BIN="rust/target/${{ matrix.target }}/release/rgoe${{ matrix.ext }}"
          OUT="rgoe-${{ needs.set-version.outputs.version }}-${{ matrix.target }}-live${{ matrix.ext }}"
          cp "$BIN" "dist/$OUT"
          ( cd dist && shasum -a 256 "$OUT" > "$OUT.sha256" )
          ls -l dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rgoe-${{ matrix.target }}-live
          path: dist/*

      - name: Attach to Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
