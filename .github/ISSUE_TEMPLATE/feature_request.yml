name: Feature request
description: Propose a focused improvement to Shade Tree
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Explain the problem first. Proposals that affect anonymity, authorization, discovery, payments, or protocol behavior should address the trust model explicitly.

  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I searched existing issues and roadmap documents for related work.
          required: true
        - label: This request does not disclose a security vulnerability or sensitive infrastructure details.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete limitation or user need should be addressed? Who encounters it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful behavior or interface change.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note current workarounds or simpler approaches you considered.

  - type: textarea
    id: trust_model
    attributes:
      label: Security and trust-model impact
      description: Explain new trusted parties, data exposure, failure modes, protocol compatibility, or state why none apply.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes that would make the request complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: dropdown
    id: contribution
    attributes:
      label: Contribution
      description: Are you interested in implementing this after the design is agreed?
      options:
        - "Yes"
        - Maybe, with guidance
        - "No"
    validations:
      required: true
