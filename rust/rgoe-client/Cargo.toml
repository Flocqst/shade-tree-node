[package]
name = "rgoe-client"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "RGOE distributable client: single static binary with embedded Tor. Rust port of client/rgoe-client.mjs."
publish = false

[[bin]]
name = "rgoe"
path = "src/main.rs"

[features]
# `live` pulls the RLN prover (rgoe-rln -> ark-circom/wasmer) so `rgoe egress` can mint a
# REAL envelope (T-RUST-2d). It is OFF by default: the everyday `cargo build`
# (default-members) never compiles the heavy native tree, keeping the deterministic client
# sub-second. Build the live path with `cargo build -p rgoe-client --features live`.
live = ["dep:rgoe-rln"]

[dependencies]
rgoe-proto = { path = "../rgoe-proto" }
# OPTIONAL, feature-gated (`live`): the RLN Groth16 prover + native depth-20 Poseidon tree
# (T-RUST-2b/2c). Excluded from default-members and only compiled under `--features live`,
# so the default build stays fast (no ark-circom / wasmer).
rgoe-rln = { path = "../rgoe-rln", optional = true }
# T-RUST-2 deterministic client: parse UNTRUSTED directory/announce/receipt JSON into
# local DTOs, then hand the mapped rgoe-proto structs to the trust-critical checks.
# serde/serde_json live ONLY here — rgoe-proto's canonical byte path stays serde-free.
serde = { version = "1", features = ["derive"] } # derive Deserialize on the untrusted-JSON DTOs
serde_json = "1"                                 # parse the directory/receipt files
# hex: render pubkeys recovered from a verified receipt for display.
hex = "0.4"
# arg parsing is hand-rolled (no clap) to keep the dep tree tiny; a small seeded PRNG
# (mulberry32, in-crate) drives `select` so no `rand` runtime dep is needed either.

# NOTE (T-RUST-2b, DEFERRED): the heavy native deps for a LIVE egress are intentionally
# NOT added in this run so the workspace stays fast to build. When implementing live
# egress (see `live_egress` in src/main.rs), add:
#   arti-client / tor-rtcompat -- embedded Tor, dial gateway/bootnode onions (no
#                                 system tor daemon, no SOCKS, no torrc)
#   zerokit (rln)              -- PSE canonical Rust RLN prover (envelope Groth16 proofs)
#   alloy                      -- chain reads (GatewayRegistry.isStaked, operator sig)
#   tokio                      -- async runtime
#   hyper                      -- bootnode HTTP (/directory, /announce)
