[package]
name = "rgoe-proto"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Trust-critical RGOE wire-format checks (onion<->ed25519 binding, canonical byte encodings, ed25519 verify, request-signal). Rust port of the JS reference (lib/directory.mjs, bootnode/announce.mjs, lib/rln.mjs)."
publish = false

[dependencies]
# T-RUST-1 crypto/encoding deps (wire-format conformance surface):
ed25519-dalek = "2"   # RFC 8032 ed25519 sign/verify (null-digest, raw 32-byte seed/pubkey)
sha3 = "0.10"         # SHA3-256 onion checksum (keccak256 signal hash later, T-RUST-1 stub)
data-encoding = "2"   # base32 no-pad lowercase (alphabet abcdefghijklmnopqrstuvwxyz234567)
hex = "0.4"           # lowercase hex for pubkey/signature (de)serialization
# NOTE: canonical_*_bytes are hand-built in fixed key order (see the encoders below),
# NEVER via a serializer — serde is intentionally NOT a dependency of the canonical path.

[dev-dependencies]
# T-RUST-1 conformance runner reads testdata/vectors.json and asserts byte-equality.
serde_json = "1"
