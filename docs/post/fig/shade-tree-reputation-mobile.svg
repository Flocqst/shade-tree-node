<svg xmlns="http://www.w3.org/2000/svg" width="720" height="570" viewBox="0 0 720 570" role="img" aria-labelledby="title desc">
  <title id="title">Shade Tree reputation gate for small screens</title>
  <desc id="desc">An admitted Merkle root anchors access. A Proxy privately proves membership without revealing which member it is. A Shade Tree node verifies the proof and enforces its local tunnel budget.</desc>

  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c09"/>
      <stop offset="0.52" stop-color="#101913"/>
      <stop offset="1" stop-color="#08100b"/>
    </linearGradient>
    <radialGradient id="amber-halo">
      <stop offset="0" stop-color="#d1b66e" stop-opacity="0.22"/>
      <stop offset="0.58" stop-color="#d1b66e" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#d1b66e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moss-halo">
      <stop offset="0" stop-color="#a3b293" stop-opacity="0.16"/>
      <stop offset="0.62" stop-color="#65765d" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#65765d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#a3b293"/>
    </marker>
    <style>
      .step { fill: #a3b293; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 34px; font-weight: 650; letter-spacing: 0.08em; }
      .label { fill: #dde5d5; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 40px; font-weight: 650; letter-spacing: -0.02em; }
      .note { fill: #a3b293; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 34px; font-weight: 500; }
    </style>

    <g id="root-icon">
      <circle r="48" fill="url(#amber-halo)"/>
      <circle r="29" fill="#111913" stroke="#d1b66e" stroke-width="4" filter="url(#soft-glow)"/>
      <path d="M-14 0l9 9 20-23" fill="none" stroke="#d1b66e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-37 29c13-8 25-19 37-34 12 15 24 26 37 34" fill="none" stroke="#65765d" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="proof-icon">
      <circle r="48" fill="url(#moss-halo)"/>
      <circle r="36" fill="#111913" stroke="#a3b293" stroke-width="3"/>
      <circle r="26" fill="none" stroke="#65765d" stroke-width="2" stroke-dasharray="3 7"/>
      <text x="0" y="12" text-anchor="middle" fill="#dde5d5" font-family="Georgia, 'Times New Roman', serif" font-size="42">π</text>
      <circle cx="-31" cy="-2" r="4" fill="#d1b66e"/>
      <circle cx="31" cy="2" r="4" fill="#d1b66e"/>
    </g>
    <g id="node-icon">
      <circle r="51" fill="url(#moss-halo)"/>
      <path d="M-5 2h10v42H-5z" fill="#65765d"/>
      <path d="M-4 21l-18-16M4 22L24 5M0 15V-7" fill="none" stroke="#65765d" stroke-width="5" stroke-linecap="round"/>
      <path d="M-33-5c0-15 12-25 27-24 7-14 27-13 34 3 14 0 23 9 23 21 0 15-13 25-28 24-9 10-27 11-38 1-12 1-23-9-23-21 0-1 0-3 1-4z" fill="#65765d"/>
      <path d="M-27-10c4-10 14-17 25-16 7-8 21-7 27 3 10 0 18 7 19 16-10-5-19-6-28-1-10-5-24-6-43-2z" fill="#a3b293" opacity="0.82"/>
      <path d="M24 29h39" fill="none" stroke="#d1b66e" stroke-width="4" stroke-linecap="round"/>
      <circle cx="35" cy="29" r="7" fill="#d1b66e"/>
      <circle cx="51" cy="29" r="7" fill="#111913" stroke="#65765d" stroke-width="3"/>
      <circle cx="67" cy="29" r="7" fill="#111913" stroke="#65765d" stroke-width="3"/>
    </g>
  </defs>

  <rect width="720" height="570" fill="url(#field)"/>
  <g fill="none" stroke="#65765d" opacity="0.08" aria-hidden="true">
    <ellipse cx="104" cy="285" rx="79" ry="255"/>
    <ellipse cx="104" cy="285" rx="48" ry="205"/>
    <path d="M720 20c-79 70-107 149-81 238s9 194-57 292"/>
  </g>

  <path d="M108 154v67M108 353v67" fill="none" stroke="#a3b293" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g aria-label="Step one, admitted root">
    <g transform="translate(108 102)"><use href="#root-icon"/></g>
    <text class="step" x="200" y="67">01</text>
    <text class="label" x="200" y="111">Admitted root</text>
    <text class="note" x="200" y="151">Approved membership set</text>
  </g>

  <g aria-label="Step two, private membership proof">
    <g transform="translate(108 286)"><use href="#proof-icon"/></g>
    <text class="step" x="200" y="238">02</text>
    <text class="label" x="200" y="282">Private membership</text>
    <text class="label" x="200" y="326">proof</text>
    <text class="note" x="200" y="367">Member stays hidden</text>
  </g>

  <g aria-label="Step three, node budget enforcement">
    <g transform="translate(108 477)"><use href="#node-icon"/></g>
    <text class="step" x="200" y="443">03</text>
    <text class="label" x="200" y="487">Node enforces budget</text>
    <text class="note" x="200" y="528">Local tunnel allowance</text>
  </g>
</svg>
