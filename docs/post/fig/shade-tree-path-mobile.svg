<svg xmlns="http://www.w3.org/2000/svg" width="720" height="820" viewBox="0 0 720 820" role="img" aria-labelledby="title desc">
  <title id="title">Shade Tree traffic path for small screens</title>
  <desc id="desc">A vertical traffic path runs from the Agent to its local Proxy, through Tor to a proof-gated Shade Tree node, and then to the Destination.</desc>

  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070c09"/>
      <stop offset="0.52" stop-color="#111913"/>
      <stop offset="1" stop-color="#070c09"/>
    </linearGradient>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-moss" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#a3b293"/>
    </marker>
    <marker id="arrow-root" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#d1b66e"/>
    </marker>
    <style>
      .label { fill: #dde5d5; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 42px; font-weight: 650; letter-spacing: -0.01em; }
      .route { fill: #d1b66e; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 36px; font-weight: 580; }
    </style>

    <g id="agent-icon">
      <circle r="42" fill="#111913" stroke="#65765d" stroke-width="3"/>
      <circle r="20" fill="none" stroke="#a3b293" stroke-width="3"/>
      <circle r="6" fill="#dde5d5"/>
      <path d="M0-31v-10M0 31v10M-31 0h-10M31 0h10" stroke="#65765d" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="proxy-icon">
      <path d="M-47 40V-5c0-30 21-50 47-50S47-35 47-5v45" fill="#111913" stroke="#a3b293" stroke-width="4"/>
      <path d="M-23 40V-1c0-15 10-26 23-26S23-16 23-1v41" fill="none" stroke="#65765d" stroke-width="4"/>
      <circle cy="7" r="7" fill="#d1b66e"/>
    </g>
    <g id="tor-icon">
      <path d="M0-52c36 15 58 43 58 70 0 26-21 45-58 45s-58-19-58-45c0-27 22-55 58-70z" fill="#111913" stroke="#65765d" stroke-width="3"/>
      <path d="M0-34c24 12 38 32 38 50 0 19-14 31-38 31s-38-12-38-31c0-18 14-38 38-50z" fill="none" stroke="#a3b293" stroke-width="3"/>
      <path d="M0-16c13 8 20 19 20 30 0 10-7 17-20 17s-20-7-20-17c0-11 7-22 20-30z" fill="none" stroke="#65765d" stroke-width="3"/>
      <circle cy="14" r="6" fill="#a3b293"/>
    </g>
    <g id="tree-shade">
      <path d="M-7 14h14v59H-7z" fill="#65765d"/>
      <path d="M-6 38l-24-22M6 40l26-24M0 31V2" fill="none" stroke="#65765d" stroke-width="7" stroke-linecap="round"/>
      <path d="M-43 5c0-20 16-34 37-33 10-18 37-17 45 3 18 1 30 13 30 29 0 20-17 34-38 33-12 14-37 14-49 1-17 1-31-11-31-27 0-2 1-4 1-6z" fill="#65765d"/>
      <path d="M-35-1c6-13 17-21 31-20 9-10 27-9 35 4 13 0 23 9 24 21-13-7-24-7-35-1-13-7-31-8-55-4z" fill="#a3b293" opacity="0.82"/>
      <path d="M-21 73c8-6 15-14 21-24 6 10 13 18 21 24" fill="none" stroke="#65765d" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="destination-icon">
      <rect x="-54" y="-43" width="108" height="86" rx="12" fill="#111913" stroke="#a3b293" stroke-width="3"/>
      <path d="M-31-20h62M-31 0h62M-31 20h42" stroke="#65765d" stroke-width="5" stroke-linecap="round"/>
      <circle cx="32" cy="20" r="7" fill="#d1b66e"/>
    </g>
  </defs>

  <rect width="720" height="820" fill="url(#field)"/>
  <g fill="#65765d" opacity="0.065" aria-hidden="true">
    <path d="M0 820V185l48-84 48 84H70l44 77H86l56 99h-34l61 107H0z"/>
    <path d="M720 820V130l-50-88-50 88h27l-45 79h28l-58 102h35l-61 108h174z"/>
  </g>
  <rect x="22" y="22" width="676" height="776" rx="26" fill="#070c09" fill-opacity="0.58" stroke="#65765d" stroke-opacity="0.38"/>

  <path d="M150 152v38" fill="none" stroke="#a3b293" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-moss)"/>
  <path d="M150 290v44" fill="none" stroke="#a3b293" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-moss)"/>
  <path d="M150 463v45" fill="none" stroke="#d1b66e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-root)"/>
  <path d="M150 628v40" fill="none" stroke="#a3b293" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-moss)"/>
  <circle cx="150" cy="486" r="7" fill="#d1b66e" filter="url(#soft-glow)"/>

  <g transform="translate(150 110)"><use href="#agent-icon"/></g>
  <text class="label" x="260" y="123">Agent</text>

  <g transform="translate(150 250)"><use href="#proxy-icon"/></g>
  <text class="label" x="260" y="263">Proxy</text>

  <g transform="translate(150 400)"><use href="#tor-icon"/></g>
  <text class="label" x="260" y="413">Tor</text>
  <text class="route" x="260" y="493">proof-gated tunnel</text>

  <g transform="translate(150 555)"><use href="#tree-shade"/></g>
  <circle cx="204" cy="519" r="17" fill="#111913" stroke="#d1b66e" stroke-width="3"/>
  <path d="M196 519l6 6 13-15" fill="none" stroke="#d1b66e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="260" y="568">Shade Tree node</text>

  <g transform="translate(150 720)"><use href="#destination-icon"/></g>
  <text class="label" x="260" y="733">Destination</text>
</svg>
